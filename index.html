<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>TrackMyTxn — Smart Money Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --bg: #f1f5f9;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --primary: #1e293b;
            --primary-light: #334155;
            --success: #22c55e;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-light: #fecaca;
        }

        html {
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100dvh;
            min-height: 100vh;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            width: 52px;
            height: 52px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .loading-icon .material-icons {
            font-size: 24px;
            color: rgba(255,255,255,0.8);
        }

        .loading-bar {
            width: 100px;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .loading-bar-inner {
            width: 40%;
            height: 100%;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
            animation: slide 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.94); opacity: 0.6; }
        }

        @keyframes slide {
            0% { transform: translateX(-200%); }
            100% { transform: translateX(350%); }
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(150deg, #1e293b 0%, #0f172a 100%);
            padding: 56px 24px 72px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-glow-1 {
            position: absolute;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(59,130,246,0.1), transparent 70%);
            top: -80px;
            right: -60px;
            pointer-events: none;
        }

        .hero-glow-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(139,92,246,0.08), transparent 70%);
            bottom: -60px;
            left: -50px;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: fadeDown 0.7s ease both;
        }

        .logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 10px;
        }

        .app-name {
            font-size: 2rem;
            font-weight: 900;
            color: white;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
            animation: fadeDown 0.7s ease 0.05s both;
        }

        .app-name span {
            color: rgba(255,255,255,0.35);
            font-weight: 700;
        }

        .app-tagline {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.55);
            font-weight: 400;
            animation: fadeDown 0.7s ease 0.1s both;
        }

        /* ===== BODY ===== */
        .body-section {
            flex: 1;
            background: var(--bg-card);
            border-radius: 28px 28px 0 0;
            margin-top: -24px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 44px 24px 32px;
        }

        .card {
            width: 100%;
            max-width: 360px;
            text-align: center;
            animation: fadeUp 0.7s ease 0.15s both;
        }

        /* Greeting */
        .greeting {
            margin-bottom: 28px;
        }

        .greeting h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .greeting p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* Error */
        .auth-error {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            background: var(--danger-bg);
            border: 1px solid var(--danger-light);
            border-radius: 12px;
            color: var(--danger);
            font-size: 0.78rem;
            margin-bottom: 16px;
            text-align: left;
        }

        .auth-error.show { display: flex; }
        .auth-error .material-icons { font-size: 1rem; flex-shrink: 0; }

        /* ===== BUTTON ===== */
        .sign-in-btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--primary);
            border: none;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(15,23,42,0.15);
        }

        .sign-in-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(15,23,42,0.2);
        }

        .sign-in-btn:active {
            transform: translateY(0) scale(0.99);
        }

        .sign-in-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .g-icon {
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .g-icon img {
            width: 16px;
            height: 16px;
        }

        .btn-spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255,255,255,0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transform: scale(0);
            animation: rippleAnim 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== SUBTLE TRUST ===== */
        .trust-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-light);
        }

        .trust-item .material-icons {
            font-size: 0.82rem;
            color: var(--success);
        }

        /* ===== FOOTER ===== */
        .footer {
            width: 100%;
            max-width: 360px;
            text-align: center;
            margin-top: auto;
            padding-top: 28px;
            animation: fadeUp 0.7s ease 0.3s both;
        }

        .footer-text {
            font-size: 0.68rem;
            color: var(--text-light);
            line-height: 1.7;
        }

        .footer-text a {
            color: var(--text-muted);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-text a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .footer-links {
            margin-top: 6px;
        }

        .footer-links a {
            color: var(--text-light);
            font-size: 0.68rem;
            font-weight: 500;
            text-decoration: none;
            padding: 2px 6px;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-links span {
            color: var(--border);
            font-size: 0.7rem;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .hero { padding: 44px 20px 60px; }
            .app-name { font-size: 1.7rem; }
            .logo { width: 62px; height: 62px; }
            .logo img { width: 36px; height: 36px; }
            .body-section { padding: 36px 20px 24px; }
            .greeting h2 { font-size: 1.15rem; }
        }

        @media (min-width: 768px) {
            .hero { padding: 72px 24px 96px; }
            .app-name { font-size: 2.4rem; }
            .logo { width: 84px; height: 84px; }
            .logo img { width: 50px; height: 50px; }
            .body-section { padding: 52px 24px 36px; margin-top: -30px; }
            .card, .footer { max-width: 400px; }
            .sign-in-btn { padding: 17px 28px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-icon">
        <span class="material-icons">account_balance_wallet</span>
    </div>
    <div class="loading-bar">
        <div class="loading-bar-inner"></div>
    </div>
</div>

<!-- Hero -->
<div class="hero">
    <div class="hero-glow-1"></div>
    <div class="hero-glow-2"></div>
    <div class="hero-content">
        <div class="logo">
            <img src="https://placehold.co/42x42/1e293b/ffffff?text=T" alt="TrackMyTxn">
        </div>
        <div class="app-name">TrackMy<span>Txn</span></div>
        <div class="app-tagline">Smart money tracking for smart people</div>
    </div>
</div>

<!-- Body -->
<div class="body-section">

    <div class="card">

        <div class="greeting">
            <h2>Welcome back 👋</h2>
            <p>Sign in to continue to your dashboard</p>
        </div>

        <div class="auth-error" id="authError">
            <span class="material-icons">error_outline</span>
            <span id="authErrorText"></span>
        </div>

        <button class="sign-in-btn" id="googleSignInBtn" onclick="handleSignIn(this, event)">
            <div class="g-icon">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
            </div>
            Continue with Google
        </button>

        <div class="trust-line">
            <div class="trust-item">
                <span class="material-icons">check_circle</span> Free
            </div>
            <div class="trust-item">
                <span class="material-icons">check_circle</span> Secure
            </div>
            <div class="trust-item">
                <span class="material-icons">check_circle</span> Synced
            </div>
        </div>

    </div>

    <div class="footer">
        <div class="footer-text">
            By continuing, you agree to our
            <a href="terms.html">Terms</a> &amp;
            <a href="privacy-policy.html">Privacy</a>
        </div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <span>·</span>
            <a href="contact.html">Contact</a>
        </div>
    </div>

</div>

<script>
    window.addEventListener('load', function () {
        setTimeout(function () {
            var el = document.getElementById('loadingOverlay');
            if (el) {
                el.classList.add('hidden');
                setTimeout(function () { el.remove(); }, 500);
            }
        }, 700);
    });

    function handleSignIn(btn, e) {
        var rect = btn.getBoundingClientRect();
        var ripple = document.createElement('span');
        ripple.className = 'ripple';
        var size = Math.max(rect.width, rect.height);
        ripple.style.cssText =
            'width:'+size+'px;height:'+size+'px;left:'
            +(e.clientX-rect.left-size/2)+'px;top:'
            +(e.clientY-rect.top-size/2)+'px;';
        btn.appendChild(ripple);
        setTimeout(function(){ ripple.remove(); }, 550);

        btn.disabled = true;
        var orig = btn.innerHTML;
        btn.innerHTML = '<div class="btn-spinner"></div> Signing in…';

        // Replace with: signInWithGoogle();
        setTimeout(function () {
            btn.innerHTML = orig;
            btn.disabled = false;
            showAuthError('Demo mode — connect Firebase to sign in.');
        }, 2000);
    }

    function showAuthError(msg) {
        var el = document.getElementById('authError');
        var txt = document.getElementById('authErrorText');
        if (el && txt) {
            txt.textContent = msg;
            el.classList.add('show');
            setTimeout(function(){ el.classList.remove('show'); }, 6000);
        }
    }
</script>

</body>
</html>
