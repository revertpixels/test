<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>TrackMyTxn — Smart Money Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

        :root{
            --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            --bg:#f1f5f9;
            --bg-card:#ffffff;
            --border:#e2e8f0;
            --text-primary:#0f172a;
            --text-secondary:#475569;
            --text-muted:#64748b;
            --text-light:#94a3b8;
            --primary:#1e293b;
            --primary-light:#334155;
            --success:#22c55e;
            --success-bg:#f0fdf4;
            --info:#3b82f6;
            --info-bg:#eff6ff;
            --warning:#f59e0b;
            --warning-bg:#fffbeb;
            --purple:#8b5cf6;
            --purple-bg:#f5f3ff;
            --danger:#ef4444;
            --danger-bg:#fef2f2;
            --danger-light:#fecaca;
        }

        html{font-family:var(--font);-webkit-font-smoothing:antialiased}

        body{
            height:100dvh;height:100vh;
            background:var(--bg-card);
            display:flex;flex-direction:column;
            overflow:hidden;
        }

        /* ===== LOADING ===== */
        .lo{
            position:fixed;inset:0;z-index:9999;
            background:linear-gradient(150deg,#1e293b,#0f172a);
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:16px;
            transition:opacity .5s ease;
        }
        .lo.hidden{opacity:0;pointer-events:none}
        .lo-i{
            width:52px;height:52px;
            background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.1);
            border-radius:16px;
            display:flex;align-items:center;justify-content:center;
            animation:loP 1.6s ease-in-out infinite;
        }
        .lo-i .material-icons{font-size:24px;color:rgba(255,255,255,.7)}
        .lo-b{width:100px;height:2px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
        .lo-bf{width:40%;height:100%;background:rgba(255,255,255,.4);border-radius:4px;animation:loS 1s ease-in-out infinite}
        @keyframes loP{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
        @keyframes loS{0%{transform:translateX(-250%)}100%{transform:translateX(400%)}}

        /* ===== HERO ===== */
        .hero{
            background:linear-gradient(150deg,#1e293b 0%,#0f172a 100%);
            text-align:center;
            position:relative;overflow:hidden;
            flex-shrink:0;
            padding:clamp(24px,4.5vh,52px) 24px clamp(32px,5.5vh,64px);
        }
        .hero::before{
            content:'';position:absolute;inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
            background-size:48px 48px;
            mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%);
            -webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%);
            pointer-events:none;
        }
        .hg{position:absolute;border-radius:50%;pointer-events:none}
        .hg.a{
            width:260px;height:260px;
            background:radial-gradient(circle,rgba(59,130,246,.09),transparent 70%);
            top:-90px;right:-60px;animation:gd1 16s ease-in-out infinite;
        }
        .hg.b{
            width:220px;height:220px;
            background:radial-gradient(circle,rgba(139,92,246,.07),transparent 70%);
            bottom:-50px;left:-50px;animation:gd2 20s ease-in-out infinite;
        }
        .hg.c{
            width:140px;height:140px;
            background:radial-gradient(circle,rgba(34,197,94,.05),transparent 70%);
            top:35%;left:55%;animation:gd3 14s ease-in-out infinite;
        }
        @keyframes gd1{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,28px)}}
        @keyframes gd2{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-18px)}}
        @keyframes gd3{0%,100%{transform:translate(0,0)}50%{transform:translate(-12px,16px)}}

        .hero-inner{position:relative;z-index:1}

        .logo-wrap{
            width:clamp(56px,9vw,76px);height:clamp(56px,9vw,76px);
            position:relative;
            margin:0 auto clamp(10px,1.5vh,16px);
            animation:fadeD .7s cubic-bezier(.16,1,.3,1) both;
        }
        .logo-glow{
            position:absolute;inset:-8px;
            background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);
            border-radius:28px;animation:logoGlow 4s ease-in-out infinite;
        }
        @keyframes logoGlow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

        .logo{
            position:relative;z-index:1;width:100%;height:100%;
            background:rgba(255,255,255,.06);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,.1);
            border-radius:clamp(16px,2.5vw,22px);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 20px 56px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
        }
        .logo img{
            width:clamp(32px,5vw,44px);height:clamp(32px,5vw,44px);
            object-fit:contain;border-radius:10px;
        }

        .app-name{
            font-size:clamp(1.45rem,4.2vw,2.1rem);font-weight:900;color:white;
            letter-spacing:-1px;margin-bottom:clamp(3px,.6vh,7px);
            animation:fadeD .7s cubic-bezier(.16,1,.3,1) .05s both;
        }
        .app-name span{color:rgba(255,255,255,.28);font-weight:700}

        .app-tag{
            font-size:clamp(.74rem,1.7vw,.86rem);color:rgba(255,255,255,.45);
            font-weight:400;line-height:1.5;
            animation:fadeD .7s cubic-bezier(.16,1,.3,1) .1s both;
        }

        /* ===== 4 FEATURE PILLS — inside hero ===== */
        .hero-features{
            display:flex;align-items:center;justify-content:center;
            gap:clamp(5px,1vw,8px);
            margin-top:clamp(14px,2.2vh,22px);
            flex-wrap:wrap;
            animation:fadeD .7s cubic-bezier(.16,1,.3,1) .15s both;
        }

        .hf-pill{
            display:inline-flex;align-items:center;gap:5px;
            padding:clamp(5px,.8vh,7px) clamp(9px,1.5vw,13px);
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
            border-radius:999px;
            font-size:clamp(.6rem,1vw,.7rem);font-weight:600;
            color:rgba(255,255,255,.6);
            backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
            transition:all .25s ease;
        }
        .hf-pill:hover{
            background:rgba(255,255,255,.08);
            border-color:rgba(255,255,255,.14);
            color:rgba(255,255,255,.8);
        }

        .hf-dot{
            width:6px;height:6px;border-radius:50%;flex-shrink:0;
        }
        .hf-dot.green{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}
        .hf-dot.blue{background:#60a5fa;box-shadow:0 0 6px rgba(96,165,250,.4)}
        .hf-dot.orange{background:#fbbf24;box-shadow:0 0 6px rgba(251,191,36,.4)}
        .hf-dot.purple{background:#a78bfa;box-shadow:0 0 6px rgba(167,139,250,.4)}

        /* ===== BODY ===== */
        .body-section{
            flex:1;
            background:var(--bg-card);
            border-radius:30px 30px 0 0;
            margin-top:-22px;
            position:relative;z-index:2;
            display:flex;flex-direction:column;
            align-items:center;
            justify-content:flex-end;
            padding:0 20px;
            box-shadow:0 -6px 24px rgba(15,23,42,.04);
            overflow:hidden;
        }

        .content{
            width:100%;max-width:380px;
            display:flex;flex-direction:column;
            align-items:center;
            gap:clamp(10px,1.8vh,16px);
            padding-bottom:clamp(14px,2vh,22px);
        }

        /* ===== ERROR ===== */
        .auth-error{
            display:none;align-items:center;gap:8px;
            padding:10px 14px;width:100%;
            background:var(--danger-bg);border:1px solid var(--danger-light);
            border-radius:12px;color:var(--danger);
            font-size:.78rem;text-align:left;
        }
        .auth-error.show{display:flex}
        .auth-error .material-icons{font-size:1rem;flex-shrink:0}

        /* ===== BUTTONS AREA ===== */
        .buttons-area{
            width:100%;
            display:flex;flex-direction:column;
            gap:clamp(8px,1.2vh,12px);
            animation:fadeU .65s cubic-bezier(.16,1,.3,1) .18s both;
        }

        /* Google button */
        .btn-wrap{width:100%;position:relative}

        .btn-shadow{
            position:absolute;
            bottom:-8px;left:10%;right:10%;height:24px;
            background:var(--primary);border-radius:16px;filter:blur(16px);
            opacity:.1;transition:opacity .3s ease;
        }
        .btn-wrap:hover .btn-shadow{opacity:.18}

        .sign-in-btn{
            position:relative;z-index:1;
            width:100%;padding:clamp(13px,2vh,16px) 24px;
            background:var(--primary);border:none;border-radius:16px;
            display:flex;align-items:center;justify-content:center;gap:12px;
            font-family:var(--font);font-size:.95rem;font-weight:600;
            color:white;cursor:pointer;
            transition:all .28s cubic-bezier(.16,1,.3,1);
            touch-action:manipulation;-webkit-tap-highlight-color:transparent;
            overflow:hidden;
        }
        .sign-in-btn::before{
            content:'';position:absolute;
            top:0;left:12%;right:12%;height:1px;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
        }
        .sign-in-btn:hover{background:var(--primary-light);transform:translateY(-2px)}
        .sign-in-btn:active{transform:translateY(0) scale(.99)}
        .sign-in-btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

        .g-icon{
            width:28px;height:28px;background:white;
            border-radius:50%;display:flex;
            align-items:center;justify-content:center;flex-shrink:0;
            box-shadow:0 1px 4px rgba(0,0,0,.1);
        }
        .g-icon img{width:16px;height:16px}

        .btn-spinner{
            width:20px;height:20px;
            border:2.5px solid rgba(255,255,255,.25);
            border-top-color:white;border-radius:50%;
            animation:spin .7s linear infinite;
        }
        .ripple{
            position:absolute;border-radius:50%;
            background:rgba(255,255,255,.12);
            transform:scale(0);
            animation:ripA .55s ease-out forwards;
            pointer-events:none;
        }
        @keyframes ripA{to{transform:scale(4);opacity:0}}

        /* Create account button — disabled */
        .create-btn{
            width:100%;
            padding:clamp(12px,1.8vh,15px) 24px;
            background:var(--bg);
            border:1.5px solid var(--border);
            border-radius:16px;
            display:flex;align-items:center;justify-content:center;gap:10px;
            font-family:var(--font);font-size:.88rem;font-weight:600;
            color:var(--text-light);
            cursor:not-allowed;
            opacity:.55;
            position:relative;
            transition:all .25s ease;
        }
        .create-btn .material-icons{font-size:1.1rem}

        .coming-tag{
            position:absolute;
            top:-8px;right:16px;
            padding:2px 8px;
            background:var(--primary);
            color:white;
            font-size:.5rem;font-weight:700;
            letter-spacing:.8px;
            text-transform:uppercase;
            border-radius:6px;
            box-shadow:0 2px 8px rgba(15,23,42,.15);
        }

        /* Trust */
        .trust{
            display:flex;align-items:center;justify-content:center;
            gap:14px;
            animation:fadeU .65s cubic-bezier(.16,1,.3,1) .24s both;
        }
        .trust-item{
            display:flex;align-items:center;gap:4px;
            font-size:.68rem;font-weight:500;color:var(--text-light);
        }
        .trust-item .material-icons{font-size:.8rem;color:var(--success)}

        /* ===== FOOTER ===== */
        .footer{
            width:100%;max-width:380px;
            text-align:center;
            flex-shrink:0;
            padding:clamp(6px,1vh,12px) 0 clamp(10px,1.5vh,16px);
            animation:fadeU .65s cubic-bezier(.16,1,.3,1) .3s both;
        }
        .footer-text{font-size:.64rem;color:var(--text-light);line-height:1.6}
        .footer-text a{color:var(--text-muted);font-weight:600;text-decoration:none}
        .footer-text a:hover{color:var(--primary);text-decoration:underline}
        .footer-links{margin-top:3px}
        .footer-links a{
            color:var(--text-light);font-size:.64rem;
            font-weight:500;text-decoration:none;padding:2px 5px;
        }
        .footer-links a:hover{color:var(--primary)}
        .footer-links span{color:var(--border);font-size:.68rem}

        /* ===== ANIMATIONS ===== */
        @keyframes fadeD{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ===== RESPONSIVE ===== */
        @media(max-height:640px){
            .hf-pill{padding:4px 8px;font-size:.58rem}
            .sign-in-btn{padding:12px 20px;font-size:.88rem;border-radius:14px}
            .create-btn{padding:11px 20px;font-size:.82rem;border-radius:14px}
            .coming-tag{top:-7px;font-size:.46rem;padding:2px 6px}
        }

        @media(max-height:560px){
            .hero-features{margin-top:10px;gap:4px}
            .hf-pill{padding:3px 7px;font-size:.54rem;gap:3px}
            .hf-dot{width:5px;height:5px}
            .sign-in-btn{padding:11px 18px;font-size:.85rem}
            .create-btn{padding:10px 18px;font-size:.8rem}
            .g-icon{width:24px;height:24px}
            .g-icon img{width:14px;height:14px}
            .trust-item{font-size:.6rem}
            .footer{padding:4px 0 8px}
            .footer-text,.footer-links a{font-size:.58rem}
        }

        @media(max-width:340px){
            .hero-features{gap:4px}
            .hf-pill{padding:4px 7px;font-size:.56rem}
        }

        @media(min-width:768px){
            .content{max-width:420px}
            .sign-in-btn{padding:17px 28px;font-size:1rem}
            .create-btn{padding:16px 28px;font-size:.92rem}
        }
    </style>
</head>
<body>

<!-- Loading -->
<div class="lo" id="loadingOverlay">
    <div class="lo-i"><span class="material-icons">account_balance_wallet</span></div>
    <div class="lo-b"><div class="lo-bf"></div></div>
</div>

<!-- Hero — logo + name + 4 features -->
<div class="hero">
    <div class="hg a"></div>
    <div class="hg b"></div>
    <div class="hg c"></div>
    <div class="hero-inner">
        <div class="logo-wrap">
            <div class="logo-glow"></div>
            <div class="logo">
                <img src="https://placehold.co/44x44/1e293b/ffffff?text=T" alt="TrackMyTxn">
            </div>
        </div>
        <div class="app-name">TrackMy<span>Txn</span></div>
        <div class="app-tag">Smart money tracking for smart people</div>

        <!-- 4 features as pills in hero -->
        <div class="hero-features">
            <div class="hf-pill"><span class="hf-dot green"></span>Track Income</div>
            <div class="hf-pill"><span class="hf-dot blue"></span>Smart Reports</div>
            <div class="hf-pill"><span class="hf-dot orange"></span>Split Bills</div>
            <div class="hf-pill"><span class="hf-dot purple"></span>Export PDF</div>
        </div>
    </div>
</div>

<!-- Body — buttons at bottom -->
<div class="body-section">
    <div class="content">

        <!-- Error -->
        <div class="auth-error" id="authError">
            <span class="material-icons">error_outline</span>
            <span id="authErrorText"></span>
        </div>

        <!-- Buttons -->
        <div class="buttons-area">
            <div class="btn-wrap">
                <div class="btn-shadow"></div>
                <button class="sign-in-btn" id="googleSignInBtn" onclick="handleSignIn(this,event)">
                    <div class="g-icon">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
                    </div>
                    Continue with Google
                </button>
            </div>

            <button class="create-btn" disabled>
                <span class="material-icons">person_add</span>
                Create Account
                <span class="coming-tag">Coming Soon</span>
            </button>
        </div>

        <!-- Trust -->
        <div class="trust">
            <div class="trust-item"><span class="material-icons">check_circle</span>Free</div>
            <div class="trust-item"><span class="material-icons">check_circle</span>Secure</div>
            <div class="trust-item"><span class="material-icons">check_circle</span>Synced</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                By continuing, you agree to our
                <a href="terms.html">Terms</a> &amp;
                <a href="privacy-policy.html">Privacy</a>
            </div>
            <div class="footer-links">
                <a href="about.html">About</a>
                <span>·</span>
                <a href="contact.html">Contact</a>
            </div>
        </div>

    </div>
</div>

<script>
    window.addEventListener('load',function(){
        setTimeout(function(){
            var el=document.getElementById('loadingOverlay');
            if(el){el.classList.add('hidden');setTimeout(function(){el.remove()},500)}
        },700);
    });

    function handleSignIn(btn,e){
        var r=btn.getBoundingClientRect();
        var rp=document.createElement('span');
        rp.className='ripple';
        var s=Math.max(r.width,r.height);
        rp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px;';
        btn.appendChild(rp);
        setTimeout(function(){rp.remove()},550);

        btn.disabled=true;
        var orig=btn.innerHTML;
        btn.innerHTML='<div class="btn-spinner"></div> Signing in…';

        setTimeout(function(){
            btn.innerHTML=orig;
            btn.disabled=false;
            showAuthError('Demo mode — connect Firebase to sign in.');
        },2000);
    }

    function showAuthError(msg){
        var el=document.getElementById('authError');
        var txt=document.getElementById('authErrorText');
        if(el&&txt){
            txt.textContent=msg;
            el.classList.add('show');
            setTimeout(function(){el.classList.remove('show')},6000);
        }
    }
</script>

</body>
</html>
